<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- PracticeSpeak AI — variante maskable (destello + crema): el fondo llena
       el icono completo (el launcher aplica la máscara) y todo el contenido
       queda dentro del círculo seguro central (r=200). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f2ec"/>
      <stop offset="1" stop-color="#ece5da"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Destello -->
  <path d="M352 112 L364 140 L392 152 L364 164 L352 192 L340 164 L312 152 L340 140 Z" fill="#d9835f"/>

  <!-- Burbuja de diálogo, reducida a la zona segura -->
  <g fill="#b34726">
    <rect x="156" y="176" width="200" height="136" rx="40"/>
    <path d="M216 300 L198 352 L270 308 Z"/>
  </g>

  <!-- Ondas de voz -->
  <g fill="#fff8f2">
    <rect x="226" y="224" width="20" height="44" rx="10"/>
    <rect x="262" y="210" width="20" height="58" rx="10"/>
    <rect x="298" y="218" width="20" height="50" rx="10"/>
  </g>
</svg>
