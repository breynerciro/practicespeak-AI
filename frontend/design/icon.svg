<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- PracticeSpeak AI — icono maestro (destello + crema). Burbuja de diálogo
       con ondas de voz y destello, sobre fondo crema con borde suave. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f2ec"/>
      <stop offset="1" stop-color="#ece5da"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect x="5" y="5" width="502" height="502" rx="110" fill="none" stroke="#ddd0be" stroke-width="10"/>

  <!-- Destello (terracota claro, visible sobre crema) -->
  <path d="M384 92 L398 124 L430 138 L398 152 L384 184 L370 152 L338 138 L370 124 Z" fill="#d9835f"/>

  <!-- Burbuja de diálogo -->
  <g fill="#b34726">
    <rect x="116" y="150" width="264" height="180" rx="50"/>
    <path d="M180 322 L158 388 L252 332 Z"/>
  </g>

  <!-- Ondas de voz -->
  <g fill="#fff8f2">
    <rect x="196" y="212" width="26" height="56" rx="13"/>
    <rect x="242" y="196" width="26" height="72" rx="13"/>
    <rect x="288" y="204" width="26" height="64" rx="13"/>
  </g>
</svg>
